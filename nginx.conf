server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the service worker so a deploy's new sw.js is picked
    # up promptly instead of sitting behind a cached copy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # nginx's stock mime.types has no .webmanifest entry, so it was served as
    # application/octet-stream; Android's install (WebAPK) flow wants the
    # proper type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
