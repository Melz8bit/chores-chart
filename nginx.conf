server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the service worker so a deploy's new sw.js is picked
    # up promptly instead of sitting behind a cached copy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
